version: '3.8'

services:
  agent-core:
    image: ${DOCKERHUB_USERNAME:-inuappcenter}/${PROJECT_NAME:-inu-agent-core}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${CONTAINER_NAME:-inu-agent-core}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - REDIS_HOST=agent-redis
      - REDIS_PORT=6379
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - agent-redis
    networks:
      - agent-network

  agent-redis:
    image: redis:7-alpine
    container_name: inu-agent-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - agent-network

networks:
  agent-network:
    driver: bridge

volumes:
  redis-data:
