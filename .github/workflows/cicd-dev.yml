name: "[Dev] CI & CD"

on:
  push:
    branches: [ "develop", "dev" ]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        run: |
          pytest -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: DockerHub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.USERNAME }}/${{ secrets.PROJECT_NAME }}:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST_ADDRESS }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.PASSWORD || secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SERVER_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "docker-compose.yml"
          target: ${{ secrets.MOUNT_PATH_DEV || secrets.MOUNT_PATH }}

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST_ADDRESS }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.PASSWORD || secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SERVER_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e
            
            TARGET_PATH="${{ secrets.MOUNT_PATH_DEV || secrets.MOUNT_PATH }}"
            mkdir -p $TARGET_PATH
            cd $TARGET_PATH
            
            # .env 파일 생성
            cat > .env <<'EOF'
            ${{ secrets.ENV_DEV || secrets.ENV_PROD }}
            EOF
            
            export DOCKERHUB_USERNAME=${{ secrets.USERNAME }}
            export PROJECT_NAME=${{ secrets.PROJECT_NAME }}
            export IMAGE_TAG=dev
            
            # Docker Hub 로그인 및 최신 개발 이미지 Pull
            docker login -u ${{ secrets.USERNAME }} -p ${{ secrets.TOKEN }}
            docker compose pull agent-core
            
            # 컨테이너 실행
            docker compose up -d --remove-orphans
            
            # 불필요한 댕글링 이미지 정리
            docker image prune -f
